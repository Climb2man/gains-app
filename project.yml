name: Gains
options:
  bundleIdPrefix: com.gains
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # AD-HOC simulator code signing (identity "-"). The simulator accepts ad-hoc signing WITHOUT an
    # Apple Developer account, and signing is what makes the app's `keychain-access-groups` entitlement
    # actually take effect, without it, the unsigned build's SecItem* calls fail with -34018
    # (errSecMissingEntitlement), so the dev OpenRouter key + the Whoop session can't persist. Ad-hoc
    # signing keeps the simulator-only loop fully autonomous (no signing assets, no provisioning).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "28"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Release:
      # Device / TestFlight signing. The Debug base above stays ad-hoc ("-") so the autonomous simulator
      # loop needs no Apple account (and the keychain entitlement still works); a RELEASE archive signs
      # for real distribution via the developer account, automatic signing + the team. The archive uses
      # an Apple Development identity and the App Store export step re-signs it for distribution.
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_STYLE: Automatic
      # Your Apple Developer Team ID, read from the environment by XcodeGen (see .env.example), NOT
      # committed: this is a public repo and the team ID ties it to a personal Apple account. Set it in
      # the gitignored repo-root .env; scripts/ship-testflight.sh exports it before `xcodegen generate`.
      # Unset it expands to empty and only Release/device signing fails, the simulator loop is unaffected.
      DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
      CODE_SIGNING_REQUIRED: "YES"
targets:
  Gains:
    type: application
    platform: iOS
    sources:
      # The whole Sources tree EXCEPT Sources/Widget, that folder holds the WidgetKit extension's
      # `@main GainsWidgetBundle`, which must NOT compile into the app (two @main entry points would
      # collide). The app target gets the shared `Sources/Shared/WidgetShared.swift` (writes the
      # snapshot) but not the extension's @main. The widget target (below) compiles Sources/Widget.
      - path: Sources
        excludes:
          - "Widget/**"
    # Embed the WidgetKit extension so the app bundle carries it (a widget can only be installed via its
    # containing app). XcodeGen copies the built `.appex` into the app's PlugIns and adds the build dep.
    dependencies:
      - target: GainsWidget
    # Attach the unit-test bundle to the auto-generated Gains scheme's Test action so
    # `xcodebuild test -scheme Gains` runs it (xcodegen doesn't infer this from the dependency alone).
    scheme:
      testTargets:
        - GainsTests
        - GainsUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nxw.gains
      configs:
        # Per-config entitlements, set manually instead of via the `entitlements:` property, that property
        # forces CODE_SIGN_ENTITLEMENTS for BOTH configs, so a per-config override there is ignored. Here
        # the Release override wins. Debug = Gains.entitlements (bare keychain group) so the UNSIGNED
        # simulator keychain works (SecItem* needs a declared group it can target, else -34018). Release =
        # Gains-Release.entitlements (team-prefixed `$(AppIdentifierPrefix)com.nxw.gains.shared`) which a
        # signed device profile grants. Both files also carry HealthKit + the GainsWidget App Group.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Gains.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Gains-Release.entitlements
    info:
      path: Gains-Info.plist
      properties:
        CFBundleDisplayName: Gains
        # Flow the version + build number from MARKETING_VERSION / CURRENT_PROJECT_VERSION (above) so a
        # bump in this file actually ships, otherwise XcodeGen emits a fixed 1.0/1 and App Store Connect
        # rejects a re-used build number on the second TestFlight upload.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only exempt encryption (HTTPS/TLS + Keychain), declare it so App Store Connect skips the
        # export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iPhone-only + portrait. UIRequiresFullScreen opts the app out of iPad multitasking, so App Store
        # validation doesn't demand all four orientations (it otherwise rejects a portrait-only build).
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Gains reads your body measurements (weight, body fat, height) so your private health record stays current. Your data never leaves the device."
        NSHealthUpdateUsageDescription: "Gains can save measurements you confirm back to Apple Health."
        # Barcode scanning (food-logging-spec §7). The camera reads a product barcode entirely
        # on-device; only the resulting UPC/EAN number is sent to the free Open Food Facts lookup.
        # No image, no identity, no key ever leaves the device for a barcode.
        NSCameraUsageDescription: "Gains uses the camera to scan a product barcode or a nutrition label so it can estimate macros. Scanning happens on your device; only the barcode number is looked up."
        # The food-photo flows pick from the library via the out-of-process pickers (no blanket
        # library access), but the purpose string is declared anyway: App Store static analysis
        # flags photo-API references without one, and it costs nothing to be explicit.
        NSPhotoLibraryUsageDescription: "Gains lets you pick a food photo to estimate macros. The photo stays on your device; only the single estimate request leaves, on your own key."

  # ── GainsWidget, the WidgetKit extension (today's-calories ring) ──────────────────────────────
  # An app-extension target embedded in the Gains app. It compiles ONLY the widget's @main bundle
  # (Sources/Widget), the SHARED snapshot/store/view (Sources/Shared/WidgetShared.swift), and the
  # design tokens (Sources/DesignSystem/Theme.swift) the view reads, no other app code links in.
  # The App Group `group.com.nxw.gains` is the only channel between the app and this extension.
  GainsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared/WidgetShared.swift
      - path: Sources/DesignSystem/Theme.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nxw.gains.GainsWidget
    entitlements:
      path: GainsWidget.entitlements
      properties:
        # Must match the app target's App Group so both processes read/write the same UserDefaults suite.
        com.apple.security.application-groups:
          - group.com.nxw.gains
    info:
      path: GainsWidget-Info.plist
      properties:
        # App Store validation requires the WidgetKit extension to carry its own display name.
        CFBundleDisplayName: Gains
        # The extension's version + build MUST match the host app's (App Store Connect requirement), so
        # flow them from the same MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # WidgetKit extension point, without this NSExtension key the .appex isn't recognized as a widget.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ── GainsTests, unit tests for the safety-relevant pure-math modules ──────────────────────────
  # A hosted unit-test bundle covering the dependency-free math that powers General-Wellness-lane
  # features: CorrelationMath (C1 correlations) + GoalPaceMath (B3 weight-pace). Deterministic coverage
  # so a regression in r, the EWMA trend, the status band, the projection, or the data-honesty gate
  # fails a test rather than reaching a user. Run: `xcodebuild test -scheme GainsTests`.
  GainsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Gains
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.nxw.gains.tests

  # ── GainsUITests, UI automation to REPRODUCE the Overview carousel horizontal-pan bug ─────────────
  # Drives a swipe on the date carousel and captures before/after screenshots, so the gesture bug can be
  # observed + a fix verified headlessly (we can't inject touch any other way). Run:
  # `xcodebuild test -scheme Gains -only-testing:GainsUITests`.
  GainsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Gains
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.nxw.gains.uitests
        TEST_TARGET_NAME: Gains
